<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="referrer" content="no-referrer" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#0d1117" />
        <title>Admin · secbin</title>
        <meta name="description" content="Encrypted, zero-knowledge notes and file sharing. Everything is encrypted in your browser; the server never sees it." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="secbin" />
        <meta property="og:title" content="secbin · zero-knowledge sharing" />
        <meta property="og:description" content="Encrypted, zero-knowledge notes and file sharing. Everything is encrypted in your browser; the server never sees it." />
        <meta name="twitter:card" content="summary" />
        <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
        <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
        <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="apple-mobile-web-app-title" content="secbin" />
        <!-- Blocking, first-party (CSP-safe): sets the theme class before paint. -->
        <script src="/js/theme-init.js"></script>
        <link rel="stylesheet" href="/css/styles.css" />
        <!-- CSP is a response header (public/_headers + the Worker). First-party only. -->
        <script defer src="/js/theme.js"></script>
        <script type="module" src="/dashboard/js/admin.js"></script>
        <!-- Service worker + install banner (public/js/pwa.js). -->
        <script type="module" src="/js/pwa.js"></script>
    </head>
    <body>
        <!-- Guilloché watermark — security-print ambience; pure ornament. -->
        <svg class="watermark" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="0.5">
                <circle cx="32" cy="32" r="29" />
                <circle cx="32" cy="32" r="24.5" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(30 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(60 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(90 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(120 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(150 32 32)" />
                <circle cx="32" cy="32" r="4.2" />
            </g>
        </svg>
        <div class="imp-banner" id="imp-banner" role="status" hidden>
            <span id="imp-text">Viewing as another user</span>
            <button type="button" class="btn" id="imp-return">Return to admin</button>
        </div>
        <header class="topbar reveal">
            <a class="brand" href="/dashboard/" id="brand" aria-label="secbin — home">
                <span class="wm-b">sec</span><span class="wm-a">bin</span>
            </a>
            <div class="topbar-right">
                <nav class="dash-nav" id="dash-nav" aria-label="Dashboard" hidden>
                    <a class="back" href="/dashboard/" data-nav="new"><span>new</span></a>
                    <a class="back" href="/dashboard/shares/" data-nav="shares"><span>my shares</span></a>
                    <a class="back" href="/dashboard/account/" data-nav="account"><span>account</span></a>
                    <a class="back" href="/dashboard/admin/" data-nav="admin" id="nav-admin" hidden><span>admin</span></a>
                    <button type="button" class="back" id="nav-logout"><span>log out</span></button>
                </nav>
                <button
                    type="button"
                    id="themeToggle"
                    class="theme-toggle"
                    aria-label="Toggle light/dark theme"
                    aria-pressed="true"
                >
                    <svg
                        class="ico-sun"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                        />
                    </svg>
                    <svg
                        class="ico-moon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="wrap wrap-wide">
            <section id="view-admin" tabindex="-1">
                <div class="head reveal d1">
                    <p class="eyebrow">administration</p>
                    <h1 class="title">Owner <span class="title-em">controls.</span></h1>
                </div>
                <div class="banner warn" id="env-banner" role="alert" hidden></div>
                <div class="tabs reveal d2" role="tablist" aria-label="Admin sections">
                    <button type="button" role="tab" class="tab" data-tab="users" aria-selected="true">Users</button>
                    <button type="button" role="tab" class="tab" data-tab="shares" aria-selected="false">Shares</button>
                    <button type="button" role="tab" class="tab" data-tab="defaults" aria-selected="false">Defaults &amp; quotas</button>
                    <button type="button" role="tab" class="tab" data-tab="settings" aria-selected="false">Settings</button>
                    <button type="button" role="tab" class="tab" data-tab="viewer" aria-selected="false">Viewer</button>
                    <button type="button" role="tab" class="tab" data-tab="security" aria-selected="false">Security</button>
                    <button type="button" role="tab" class="tab" data-tab="public" aria-selected="false">Public access</button>
                    <button type="button" role="tab" class="tab" data-tab="portable" aria-selected="false">Import / export</button>
                    <button type="button" role="tab" class="tab" data-tab="audit" aria-selected="false">Audit log</button>
                </div>
                <p class="msg" id="admin-msg" role="status" hidden></p>
                <div class="admin-panel" data-panel="users"></div>
                <div class="admin-panel" data-panel="shares" hidden></div>
                <div class="admin-panel" data-panel="defaults" hidden></div>
                <div class="admin-panel" data-panel="settings" hidden></div>
                <div class="admin-panel" data-panel="viewer" hidden></div>
                <div class="admin-panel" data-panel="security" hidden></div>
                <div class="admin-panel" data-panel="public" hidden></div>
                <div class="admin-panel" data-panel="portable" hidden></div>
                <div class="admin-panel" data-panel="audit" hidden></div>
            </section>
            <footer class="foot reveal d4">
                <nav class="foot-links" id="foot-links" aria-label="Project">
                    <a href="https://github.com/kaerez/bin" rel="noopener noreferrer" target="_blank">Source</a>
                    <span class="foot-sep" aria-hidden="true">·</span>
                    <a href="https://github.com/kaerez/bin/blob/main/SECURITY.md" rel="noopener noreferrer" target="_blank">Threat Model</a>
                </nav>
                <p class="foot-crypto mono" aria-label="Cryptography">
                    AES-256-GCM · Argon2id · HKDF-SHA256 · Key stays in the URL
                    <span class="foot-frag">#fragment</span>
                </p>
            </footer>
        </main>

        <div id="toast" role="status" aria-live="polite"></div>
    </body>
</html>
