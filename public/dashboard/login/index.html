<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="referrer" content="no-referrer" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#0d1117" />
        <title>Log in · secbin</title>
        <meta name="description" content="Encrypted, zero-knowledge notes and file sharing. Everything is encrypted in your browser; the server never sees it." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="secbin" />
        <meta property="og:title" content="secbin · zero-knowledge sharing" />
        <meta property="og:description" content="Encrypted, zero-knowledge notes and file sharing. Everything is encrypted in your browser; the server never sees it." />
        <meta name="twitter:card" content="summary" />
        <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
        <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
        <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="apple-mobile-web-app-title" content="secbin" />
        <!-- Blocking, first-party (CSP-safe): sets the theme class before paint. -->
        <script src="/js/theme-init.js"></script>
        <link rel="stylesheet" href="/css/styles.css" />
        <!-- CSP is a response header (public/_headers + the Worker). First-party only. -->
        <script defer src="/js/theme.js"></script>
        <script type="module" src="/js/login.js"></script>
        <!-- Service worker + install banner (public/js/pwa.js). -->
        <script type="module" src="/js/pwa.js"></script>
    </head>
    <body>
        <!-- Guilloché watermark — security-print ambience; pure ornament. -->
        <svg class="watermark" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="0.5">
                <circle cx="32" cy="32" r="29" />
                <circle cx="32" cy="32" r="24.5" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(30 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(60 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(90 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(120 32 32)" />
                <ellipse cx="32" cy="32" rx="24.5" ry="9.5" transform="rotate(150 32 32)" />
                <circle cx="32" cy="32" r="4.2" />
            </g>
        </svg>
        <header class="topbar reveal">
            <a class="brand" href="/" id="brand" aria-label="secbin — home">
                <span class="wm-b">sec</span><span class="wm-a">bin</span>
            </a>
            <div class="topbar-right">

                <button
                    type="button"
                    id="themeToggle"
                    class="theme-toggle"
                    aria-label="Toggle light/dark theme"
                    aria-pressed="true"
                >
                    <svg
                        class="ico-sun"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                        />
                    </svg>
                    <svg
                        class="ico-moon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="wrap">
            <section id="view-login" tabindex="-1">
                <div class="head reveal d1">
                    <p class="eyebrow">sign in</p>
                    <h1 class="title">Welcome <span class="title-em">back.</span></h1>
                    <p class="subtitle">Your password is stretched with Argon2id in this browser — it is never sent to the server.</p>
                </div>
                <form class="stack reveal d2 form" id="login-form" autocomplete="on">
                    <label class="field-label" for="login-user">Username</label>
                    <input class="input" id="login-user" name="username" autocomplete="username" required maxlength="64" />
                    <label class="field-label" for="login-pass">Password</label>
                    <div class="pw pw-wide">
                        <input type="password" id="login-pass" class="input" placeholder="Password" autocomplete="current-password" aria-label="Password" />
                        <button type="button" class="peek" id="login-pass-peek" aria-label="Show password" aria-pressed="false">
                            <svg
                                class="ico-eye"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"
                                />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg
                                class="ico-eye-off"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path
                                    d="M10.6 6.7A9.9 9.9 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a18.3 18.3 0 0 1-3.3 4.2M6.2 8A18.4 18.4 0 0 0 2 12s3.6 6.5 10 6.5a10 10 0 0 0 3.9-.8"
                                />
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                <path d="M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="cta" id="login-btn">Log in</button>
                    <p class="msg error" id="login-msg" role="alert" hidden></p>
                </form>
            </section>
            <footer class="foot reveal d4">
                <nav class="foot-links" id="foot-links" aria-label="Project">
                    <a href="https://github.com/kaerez/bin" rel="noopener noreferrer" target="_blank">Source</a>
                    <span class="foot-sep" aria-hidden="true">·</span>
                    <a href="https://github.com/kaerez/bin/blob/main/SECURITY.md" rel="noopener noreferrer" target="_blank">Threat Model</a>
                </nav>
                <p class="foot-crypto mono" aria-label="Cryptography">
                    AES-256-GCM · Argon2id · HKDF-SHA256 · Key stays in the URL
                    <span class="foot-frag">#fragment</span>
                </p>
            </footer>
        </main>

        <div id="toast" role="status" aria-live="polite"></div>
    </body>
</html>
